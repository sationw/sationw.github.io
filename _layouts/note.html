---
layout: default
---
<article class="note-page">
  <div class="container">
    <header class="note-header">
      <h1 class="note-title">{{ page.title }}</h1>
      <div class="note-meta">
        <span><i class="far fa-calendar-alt"></i> {{ page.date | date: "%Y-%m-%d" }}</span>
        <span><i class="fas fa-tag"></i> {{ page.category }}</span>
      </div>
    </header>
    <div class="note-content">
      {{ content }}
    </div>
  </div>
</article>
